<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TrainIQ — Faculty Training & Performance System</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f1a;--sur:#111827;--card:#1c2333;--brd:#2d3748;
  --acc:#f59e0b;--bl:#3b82f6;--ok:#10b981;--err:#ef4444;
  --txt:#f1f5f9;--mut:#94a3b8;
  --r:10px;--r2:8px;--r3:6px
}
html,body{height:100%;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,sans-serif}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color-scheme:dark}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--brd);border-radius:4px}
::-webkit-scrollbar-track{background:var(--sur)}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:220px;background:var(--sur);border-right:1px solid var(--brd);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;flex-shrink:0;transition:.25s}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--sur);border-bottom:1px solid var(--brd);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:50}
#content{flex:1;overflow-y:auto;padding:24px}
.logo-wrap{padding:16px 18px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-name{font-weight:700;font-size:17px;color:var(--acc);letter-spacing:.5px}
.logo-sub{font-size:9px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase}
nav{flex:1;padding:8px 10px;overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:var(--r2);border:none;font-size:13px;margin-bottom:2px;transition:all .15s;background:transparent;color:var(--mut)}
.nav-btn:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.nav-btn.active{background:rgba(245,158,11,.12);color:var(--acc);font-weight:500}
.nav-badge{margin-left:auto;background:var(--err);color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700}
.user-foot{padding:12px 10px;border-top:1px solid var(--brd)}
.user-row{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r2);border:none;font-size:13px;font-weight:500;transition:all .15s;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--acc);color:#0b0f1a}
.btn-blue{background:var(--bl);color:#fff}
.btn-ghost{background:transparent;color:var(--mut);border:1px solid var(--brd)}
.btn-ghost:hover{color:var(--txt);border-color:var(--mut)}
.btn-danger{background:rgba(239,68,68,.15);color:var(--err);border:1px solid rgba(239,68,68,.3)}
.btn-green{background:rgba(16,185,129,.2);color:var(--ok);border:1px solid rgba(16,185,129,.3)}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-full{width:100%;justify-content:center}
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px}
.card-lg{padding:24px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-amber{background:rgba(245,158,11,.15);color:#fbbf24}
.badge-blue{background:rgba(59,130,246,.15);color:#60a5fa}
.badge-green{background:rgba(16,185,129,.15);color:#34d399}
.badge-red{background:rgba(239,68,68,.15);color:#f87171}
.badge-gray{background:rgba(148,163,184,.12);color:#94a3b8}
.badge-purple{background:rgba(139,92,246,.15);color:#a78bfa}
.input{width:100%;padding:9px 12px;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r2);color:var(--txt);font-size:13px;outline:none;transition:border .15s}
.input:focus{border-color:rgba(245,158,11,.5);outline:2px solid rgba(245,158,11,.1)}
.label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.field{margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ava{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;letter-spacing:.5px;text-transform:uppercase}
.ava-amber{background:rgba(245,158,11,.2);color:#f59e0b}
.ava-blue{background:rgba(59,130,246,.2);color:#60a5fa}
.ava-green{background:rgba(16,185,129,.2);color:#34d399}
.ava-purple{background:rgba(139,92,246,.2);color:#a78bfa}
.ava-red{background:rgba(239,68,68,.2);color:#f87171}
.stat-card{display:flex;align-items:center;gap:14px}
.stat-icon{border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.progress-wrap{height:5px;background:var(--brd);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .5s}
#auth-wrap{min-height:100vh;display:flex;background:var(--bg);padding:0}
.auth-left{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;min-height:100vh}

.auth-box{width:100%;max-width:420px}

.tabs{display:flex;background:var(--sur);border-radius:var(--r2);padding:3px;margin-bottom:20px}
.tab{flex:1;padding:7px;border:none;border-radius:var(--r3);font-size:12px;font-weight:500;transition:all .15s;cursor:pointer;background:transparent;color:var(--mut)}
.tab.active{background:var(--card);color:var(--txt)}
.demo-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r2);border:1px solid var(--brd);background:transparent;cursor:pointer;margin-bottom:6px;transition:all .15s}
.demo-row:hover,.demo-row.sel{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.06)}
.err-box{padding:9px 12px;border-radius:var(--r3);background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#f87171;font-size:12px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.ok-box{padding:9px 12px;border-radius:var(--r3);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:var(--ok);font-size:12px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mut);cursor:pointer;padding:2px;display:flex}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.grid-31{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.grid-equal{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.filter-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.page-hdr{margin-bottom:20px}
.page-hdr h2{font-size:22px;font-weight:700;color:var(--txt)}
.page-hdr p{color:var(--mut);font-size:13px;margin-top:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:24px;width:100%;max-width:500px;position:relative;max-height:90vh;overflow-y:auto}
.modal-close{position:absolute;right:14px;top:14px;background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer;line-height:1;padding:2px 7px;border-radius:4px}
.modal-close:hover{color:var(--txt);background:var(--sur)}
.modal-title{font-size:16px;font-weight:700;color:var(--txt);margin-bottom:20px}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:9999;max-width:360px;display:flex;align-items:center;gap:10px;animation:slideUp .25s ease;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast-ok{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4);color:var(--ok)}
.toast-err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--err)}
.toast-info{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);color:var(--acc)}
.task-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.task-info{flex:1;min-width:160px}
.task-title{font-size:13px;font-weight:500;color:var(--txt);margin-bottom:4px}
.task-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--mut);align-items:center}
.task-actions{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.notif-row{display:flex;gap:14px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.search-wrap{position:relative;margin-left:auto}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.search-input{padding:7px 12px 7px 30px;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r2);color:var(--txt);font-size:12px;outline:none;width:180px}
.search-input:focus{border-color:rgba(245,158,11,.5)}
.preset-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 12px;border-radius:var(--r2);border:1px solid var(--brd);background:var(--sur);cursor:pointer;margin-bottom:6px;transition:all .15s;text-align:left}
.preset-btn:hover,.preset-btn.sel{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.06)}
.info-box{padding:14px;border-radius:var(--r2);margin-bottom:12px}
.info-box-blue{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2)}
.info-box-amber{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2)}
.info-box-red{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2)}
.divider{height:1px;background:var(--brd);margin:14px 0}
.content-h1{font-size:22px;font-weight:700;color:var(--txt);line-height:1.3;margin-bottom:10px}
.content-h2{font-size:16px;font-weight:700;color:var(--txt);margin-top:22px;margin-bottom:9px}
.content-h3{font-size:13px;font-weight:600;color:var(--acc);margin-top:14px;margin-bottom:7px}
.content-p{font-size:13px;color:var(--mut);line-height:1.75;margin-bottom:4px}
.content-li{display:flex;gap:10px;padding:4px 0;color:var(--mut);font-size:13px;line-height:1.6}
[data-view-user]:hover,[data-view-content]:hover{transform:translateY(-2px)}
.empty{text-align:center;padding:56px 20px}
.kanban-board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;min-height:400px}
.kanban-col{background:var(--sur);border:1px solid var(--brd);border-radius:10px;display:flex;flex-direction:column;min-height:300px}
.kanban-header{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--brd);border-radius:10px 10px 0 0}
.kanban-body{padding:10px;flex:1;overflow-y:auto}
.kanban-card{background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:12px;margin-bottom:8px;transition:transform .15s}
.kanban-card:hover{transform:translateY(-1px);border-color:rgba(245,158,11,.3)}
@media(max-width:700px){.kanban-board{grid-template-columns:1fr}}
.user-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px}
.user-card-info{flex:1;min-width:180px}
.user-card-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease}
svg{display:inline-block;vertical-align:middle;pointer-events:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:700px){
  #sidebar{position:fixed;z-index:100;transform:translateX(-100%);height:100vh}
  #sidebar.open{transform:translateX(0)}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-31,.grid-equal,.grid-3{grid-template-columns:1fr}
  #content{padding:16px}
}
</style>
</head>

function toast(msg,type='ok'){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className=`toast toast-${type}`;
  t.innerHTML=`${ic(type==='ok'?'checkcircle':type==='err'?'alert':'info')} ${msg} <button style="background:none;border:none;cursor:pointer;font-size:18px;margin-left:auto;padding:0;color:inherit" onclick="this.parentNode.remove()">×</button>`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove&&t.remove(),4000);
}

function bindAuth(){
  document.querySelectorAll('[data-auth-tab]').forEach(el=>el.addEventListener('click',()=>setState({auth:{...S.auth,mode:el.dataset.authTab,err:'',ok:''}})));
  document.querySelectorAll('[data-demo]').forEach(el=>el.addEventListener('click',()=>{
    const u=byId(S.users,el.dataset.demo);
    if(u) setState({auth:{...S.auth,email:u.email,pw:u.pw,err:'',ok:''}});
  }));
  document.querySelectorAll('[data-auth-a]').forEach(el=>el.addEventListener('click',()=>{
    const a=el.dataset.authA;
    if(a==='toggle-pw') return setState({auth:{...S.auth,showPw:!S.auth.showPw}});
    if(a==='back') return setState({auth:{...S.auth,mode:'login',err:'',ok:''}});
    if(a==='forgot') return setState({auth:{...S.auth,mode:'forgot',err:'',ok:''}});
    if(a==='forgot-submit'){
      const em=document.getElementById('a-email')?.value;
      if(!em) return setState({auth:{...S.auth,err:'Please enter your email.'}});
      toast('Password reset link sent! (Demo only)','ok');
      return setState({auth:{...S.auth,mode:'login',err:'',ok:'Reset instructions sent to '+em}});
    }
    if(a==='register-submit'){
      const name=document.getElementById('a-name')?.value?.trim();
      const email=document.getElementById('a-email')?.value?.trim();
      const pw=document.getElementById('a-pw')?.value;
      const dept=document.getElementById('a-dept')?.value?.trim()||'General';
      const role=document.getElementById('a-role')?.value||'user';
      if(!name) return setState({auth:{...S.auth,err:'Please enter your full name.'}});
      if(!email||!email.includes('@')) return setState({auth:{...S.auth,err:'Please enter a valid email address.'}});
      if(!pw||pw.length<6) return setState({auth:{...S.auth,err:'Password must be at least 6 characters.'}});
      if(S.users.find(u=>u.email===email)) return setState({auth:{...S.auth,err:'An account with this email already exists.'}});
      const newUser={id:++uid,name,email,pw,role,dept,joined:new Date().toISOString().slice(0,10),active:true};
      S.users.push(newUser);saveData();
      toast('Account created successfully! You can now sign in.','ok');
      setState({auth:{...S.auth,mode:'login',err:'',ok:`Welcome ${name}! Your account is ready. Sign in below.`,email,pw:''}});
    }
    if(a==='login-submit'){
      const email=document.getElementById('a-email')?.value?.trim();
      const pw=document.getElementById('a-pw')?.value;
      const u=S.users.find(u=>u.email===email&&u.pw===pw&&u.active);
      if(u) return setState({user:u,page:u.role==='admin'?'dashboard':'mytasks',auth:{...S.auth,err:'',ok:''}});
      setState({auth:{...S.auth,err:'Invalid email or password. Please check your credentials or use a demo account below.'}});
    }
  }));
  // Enter key
  ['a-email','a-pw'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){
      el.addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('[data-auth-a="login-submit"]')?.click();});
      el.addEventListener('input',e=>{if(id==='a-email')S.auth.email=e.target.value;if(id==='a-pw')S.auth.pw=e.target.value;});
    }
  });
}

function scard(icon,label,value,sub,color){
  const fills={amber:'rgba(245,158,11,.12)',blue:'rgba(59,130,246,.12)',green:'rgba(16,185,129,.12)',red:'rgba(239,68,68,.12)'};
  const tcs={amber:'var(--acc)',blue:'var(--bl)',green:'var(--ok)',red:'var(--err)'};
  return `<div class="card stat-card">
    <div class="stat-icon" style="width:44px;height:44px;background:${fills[color]};color:${tcs[color]}">${ic(icon)}</div>
    <div>
      <div style="font-size:26px;font-weight:700;font-variant-numeric:tabular-nums">${value}</div>
      <div style="font-size:12px;color:var(--mut);margin-top:2px">${label}</div>
      ${sub?`<div style="font-size:11px;color:${tcs[color]};margin-top:2px">${sub}</div>`:''}
    </div>
  </div>`;
}

function classifyFaculty(u){
  var tasks=S.tasks.filter(function(t){return t.to===u.id;});
  var done=tasks.filter(function(t){return t.status==='completed';});
  var total=tasks.length||1;
  var completionRate=Math.round(done.length/total*100);
  var semData=S.faculty?S.faculty.filter(function(f){return f.uid===u.id;}):[];
  var avgScore=semData.length?Math.round(semData.reduce(function(a,b){return a+b.score;},0)/semData.length):completionRate;
  var avgFeedback=semData.length?(semData.reduce(function(a,b){return a+b.feedback;},0)/semData.length).toFixed(1):'N/A';
  var grade,gradeColor,gradeLabel;
  if(avgScore>=90){grade='A+';gradeColor='green';gradeLabel='Excellent';}
  else if(avgScore>=75){grade='A';gradeColor='blue';gradeLabel='Good';}
  else if(avgScore>=60){grade='B';gradeColor='amber';gradeLabel='Average';}
  else{grade='C';gradeColor='red';gradeLabel='Poor';}
  var promotion,promotionColor,promotionIcon;
  if(avgScore>=85&&parseFloat(avgFeedback)>=4.0){promotion='Strongly Recommended for Promotion';promotionColor='ok';promotionIcon='⭐';}
  else if(avgScore>=75&&parseFloat(avgFeedback)>=3.5){promotion='Eligible for Promotion';promotionColor='bl';promotionIcon='👍';}
  else if(avgScore>=60){promotion='Needs Improvement — Monitor Next Semester';promotionColor='acc';promotionIcon='📋';}
  else{promotion='Not Recommended — Performance Plan Required';promotionColor='err';promotionIcon='⚠️';}
  return{completionRate:completionRate,avgScore:avgScore,avgFeedback:avgFeedback,grade:grade,gradeColor:gradeColor,gradeLabel:gradeLabel,promotion:promotion,promotionColor:promotionColor,promotionIcon:promotionIcon,semData:semData,totalTasks:tasks.length,doneTasks:done.length};
}

function renderSemTable(semData){

    return '<tr><td style="padding:8px 12px;border-bottom:1px solid var(--brd);font-weight:500">'+s.sem+'</td>'
      +'<td style="padding:8px 12px;text-align:center;border-bottom:1px solid var(--brd)">'+s.year+'</td>'

// My Tasks
function moveTask(id,status){
  id=Number(id);
  var task=S.tasks.find(function(t){return t.id==id;});
  S.tasks=S.tasks.map(function(t){
    if(t.id==id) return Object.assign({},t,{status:status,updated:now()});
    return t;
  });
  saveData();
  if(status==='completed'&&task){
    S.notifs.unshift({id:++nid,type:'done',title:'Task Completed',msg:S.user.name+' completed "'+task.title+'"',time:now(),read:false,uid:1});
    S.notifs.unshift({id:++nid,type:'done',title:'✓ Completed',msg:'You completed "'+task.title+'"',time:now(),read:false,uid:S.user.id});
    saveData();
    var admin=S.users.find(function(u){return u.role==='admin'&&u.active;});
    sendTaskCompletionEmail(task.title, S.user, admin);
    toast('Task completed! Email sent ✅','ok');
  } else if(status==='in-progress'){
    toast('Task moved to In Progress 🔵','ok');
  } else {
    toast('Task moved to Pending','info');
  }
  render();
}

      +'</div>'
      +'<div style="font-size:13px;font-weight:600;color:var(--txt);margin-bottom:6px">'+t.title+'</div>'
      +(t.notes?'<div style="font-size:11px;color:var(--mut);margin-bottom:8px;line-height:1.5">'+t.notes+'</div>':'')
      +'<div style="border-top:1px solid var(--brd);padding-top:8px;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">'
      +(t.status==='pending'?'<button class="btn btn-blue btn-sm" style="flex:1;justify-content:center" onclick="moveTask('+t.id+',\'in-progress\')">'+ic('play')+' Start</button>':'')
      +(t.status==='pending'?'<button class="btn btn-primary btn-sm" style="flex:1;justify-content:center" onclick="moveTask('+t.id+',\'completed\')">'+ic('checkcircle')+' Done</button>':'')
      +(t.status==='in-progress'?'<button class="btn btn-ghost btn-sm" style="flex:1;justify-content:center" onclick="moveTask('+t.id+',\'pending\')">'+ic('back')+' Pending</button>':'')
      +(t.status==='in-progress'?'<button class="btn btn-primary btn-sm" style="flex:1;justify-content:center" onclick="moveTask('+t.id+',\'completed\')">'+ic('checkcircle')+' Done</button>':'')
      +(t.status==='completed'?'<button class="btn btn-ghost btn-sm" style="flex:1;justify-content:center" onclick="moveTask('+t.id+',\'pending\')">'+ic('back')+' Reopen</button>':'')
      +(t.status==='completed'?'<button class="btn btn-blue btn-sm" style="flex:1;justify-content:center" onclick="moveTask('+t.id+',\'in-progress\')">'+ic('play')+' In Progress</button>':'')
      +'</div></div>';
  }

  function column(title,icon,color,tasks,count){
    var colorMap={gray:'148,163,184',blue:'59,130,246',green:'16,185,129'};
    var rgb=colorMap[color]||colorMap.gray;
    return `<div class="kanban-col">
      <div class="kanban-header" style="border-top:3px solid rgba(${rgb},1)">
        <div style="display:flex;align-items:center;gap:8px">
          ${ic(icon)}
          <span style="font-weight:600;font-size:13px">${title}</span>
        </div>
        <span style="background:rgba(${rgb},.15);color:rgba(${rgb},1);padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700">${count}</span>
      </div>
      <div class="kanban-body">
        ${tasks.length===0?`<div style="text-align:center;padding:30px 10px;color:var(--mut);font-size:12px">No tasks here</div>`:''}
        ${tasks.map(t=>taskCard(t)).join('')}
      </div>
    </div>`;
  }

  return `
  <div class="page-hdr" style="margin-bottom:16px">
    <h2>My Tasks</h2>
    <p>${mine.length} total · ${pending.length} pending · ${inprog.length} in progress · ${done.length} completed</p>
  </div>
  ${mine.length===0?`<div class="card empty" style="color:var(--mut)"><div style="font-size:40px;opacity:.2;margin-bottom:12px">${ic('checkcircle')}</div><div style="font-weight:500">No tasks assigned yet</div></div>`
  :`<div class="kanban-board">
    ${column('Pending','clock','gray',pending,pending.length)}
    ${column('In Progress','play','blue',inprog,inprog.length)}
    ${column('Completed','checkcircle','green',done,done.length)}
  </div>`}`;
}

  return `
  <button class="btn btn-ghost btn-sm" style="margin-bottom:20px" data-a="back-task">${ic('back')} Back to My Tasks</button>
  <div style="max-width:720px;margin:0 auto">
    <div class="card" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">

      ${t.due?`<div style="font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px">${ic('calendar')} Due: ${fmtDate(t.due)}</div>`:''}

// ═══════════════════════════════════
//  EVENT BINDING
// ═══════════════════════════════════
function bindAll(){
  // Nav
  document.querySelectorAll('[data-p]').forEach(el=>el.addEventListener('click',()=>setState({page:el.dataset.p,viewTask:null,viewContent:null,viewUserTasks:null,sideOpen:false})));

  // General actions
  document.querySelectorAll('[data-a]').forEach(el=>el.addEventListener('click',e=>{
    const a=el.dataset.a;
    if(a==='logout'){S.user=null;S.page='login';S.auth={mode:'login',email:'',pw:'',name:'',dept:'',role:'user',err:'',ok:'',showPw:false};render();return;}
    if(a==='toggle-side') return setState({sideOpen:!S.sideOpen});
    if(a==='export') return doExport();
    if(a==='clear-emails'){S.emailLog=[];saveData();toast('Email log cleared','info');render();return;}
    if(a==='reset-data'){showConfirm('Reset All Data?','This will delete all users, tasks, notifications and restore defaults. Cannot be undone.','Reset Everything','danger',function(){resetAllData();});return;}
    if(a==='back-content') return setState({viewContent:null});
    if(a==='back-dashboard') return setState({viewUserTasks:null});
    if(a==='back-task') return setState({viewTask:null});
    if(a==='mark-all-read'){S.notifs=S.notifs.map(n=>n.uid===S.user.id?{...n,read:true}:n);saveData();render();return;}
    if(a==='clear-notifs'){S.notifs=S.notifs.filter(n=>n.uid!==S.user.id);saveData();render();return;}
    if(a==='close-modal') return setState({modal:null});
    if(a==='toggle-smtp-pw') return setState({showSmtpPw:!S.showSmtpPw});
    if(a==='gen-pw'){const pw='Tr@'+Math.random().toString(36).slice(-8).toUpperCase()+'1!';document.getElementById('s-pw').value=pw;S.smtp.pw=pw;return;}
    if(a==='copy-smtp'){const s=S.smtp;navigator.clipboard.writeText(`Host: ${s.host}\nPort: ${s.port}\nUser: ${s.user}\nEncryption: ${s.enc}`).catch(()=>{});toast('Settings copied!','ok');return;}
    if(a==='save-smtp'){
      const adminEmail=document.getElementById('s-user')?.value?.trim();
      const fromName=document.getElementById('s-fname')?.value?.trim();
      const fromEmail=document.getElementById('s-femail')?.value?.trim();
      S.smtp={...S.smtp,user:adminEmail||S.smtp.user,fromName:fromName||S.smtp.fromName,fromEmail:fromEmail||S.smtp.fromEmail};
      toast('✅ Email configuration saved! Emails will send automatically.','ok');
      render();return;
    }
    if(a==='test-smtp'){sendTestEmail();return;}

    // Submit assign task
    if(a==='submit-task'){
      const title=document.getElementById('m-title')?.value?.trim();
      if(!title) return toast('Task title is required','err');
      const newTask={id:++tid,title,to:parseInt(document.getElementById('m-to').value),cid:0,by:S.user.id,pri:document.getElementById('m-pri').value,due:document.getElementById('m-due').value,notes:document.getElementById('m-notes').value,status:'pending',created:now(),updated:now()};
      S.tasks.push(newTask);saveData();
      const assignee=byId(S.users,newTask.to);
      saveData();S.notifs.unshift({id:++nid,type:'assign',title:'New Task Assigned',msg:`You were assigned "${title}"`,time:now(),read:false,uid:newTask.to});
      // Send REAL assignment email via EmailJS
      sendTaskAssignedEmail(title, assignee, newTask.due, newTask.notes);
      S.modal=null;toast(`Task assigned to ${assignee?.name}! Email notification sent 📧`,'ok');render();return;
    }

    // Submit add user
    if(a==='submit-add-user'){
      const name=document.getElementById('nu-name')?.value?.trim();
      const email=document.getElementById('nu-email')?.value?.trim();
      const pw=document.getElementById('nu-pw')?.value;
      const dept=document.getElementById('nu-dept')?.value?.trim()||'General';
      const role=document.getElementById('nu-role')?.value||'user';
      if(!name) return toast('Name is required','err');
      if(!email||!email.includes('@')) return toast('Valid email is required','err');
      if(!pw||pw.length<4) return toast('Password must be at least 4 characters','err');
      if(S.users.find(u=>u.email===email)) return toast('Email already exists','err');
      const nu={id:++uid,name,email,pw,role,dept,joined:new Date().toISOString().slice(0,10),active:true};
      S.users.push(nu);saveData();
      S.modal=null;toast(`${role==='admin'?'Admin':'User'} "${name}" created successfully!`,'ok');render();return;
    }

    // Submit edit user
    if(a==='submit-edit-user'){
      const id=parseInt(document.getElementById('eu-id')?.value);
      const name=document.getElementById('eu-name')?.value?.trim();
      const email=document.getElementById('eu-email')?.value?.trim();
      const pw=document.getElementById('eu-pw')?.value;
      const dept=document.getElementById('eu-dept')?.value?.trim();
      const role=document.getElementById('eu-role')?.value;
      if(!name) return toast('Name is required','err');
      if(!email||!email.includes('@')) return toast('Valid email is required','err');
      if(S.users.find(u=>u.email===email&&u.id!==id)) return toast('Email already used by another account','err');
      S.users=S.users.map(u=>{if(u.id!==id)return u;const updated={...u,name,email,dept:dept||u.dept,role:u.id===S.user.id?u.role:role};if(pw&&pw.length>=4)updated.pw=pw;return updated;});
      // Update current user if editing self
      if(id===S.user.id) S.user={...S.user,name,email,dept:dept||S.user.dept};
      saveData();S.modal=null;toast('User updated successfully!','ok');render();return;
    }
  }));

  // Modal triggers
  document.querySelectorAll('[data-modal]').forEach(el=>el.addEventListener('click',()=>{
    const m=el.dataset.modal;
    const uid2=el.dataset.userId;
    if(m==='assign-task') return setState({modal:modalAssignTask()});
    if(m==='add-user') return setState({modal:modalAddUser()});
    if(m==='edit-user'&&uid2) return setState({modal:modalEditUser(parseInt(uid2))});
  }));

  // View user tasks
  document.querySelectorAll('[data-view-user]').forEach(el=>el.addEventListener('click',()=>setState({viewUserTasks:parseInt(el.dataset.viewUser)})));

  // View content
  document.querySelectorAll('[data-view-content]').forEach(el=>el.addEventListener('click',()=>setState({viewContent:parseInt(el.dataset.viewContent)})));

  // View task
  document.querySelectorAll('[data-view-task]').forEach(el=>el.addEventListener('click',()=>setState({viewTask:parseInt(el.dataset.viewTask)})));

  // Task status changes now handled by inline onclick -> moveTask()

  // Delete task
  document.querySelectorAll('[data-del-task]').forEach(el=>el.addEventListener('click',()=>{
    const id=parseInt(el.dataset.delTask);
    const t=S.tasks.find(x=>x.id===id);
    showConfirm(`Delete task?`, `"${t?.title}" will be permanently removed.`, 'Delete Task', 'danger', ()=>{
      S.tasks=S.tasks.filter(x=>x.id!==id);
      saveData();toast('Task deleted','info');render();
    });
  }));

  // User management actions
  document.querySelectorAll('[data-promote]').forEach(el=>el.addEventListener('click',()=>{
    const id=parseInt(el.dataset.promote);
    S.users=S.users.map(u=>u.id===id?{...u,role:'admin'}:u);
    saveData();toast('User promoted to Admin!','ok');render();
  }));
  document.querySelectorAll('[data-demote]').forEach(el=>el.addEventListener('click',()=>{
    const id=parseInt(el.dataset.demote);
    if(S.users.filter(u=>u.role==='admin').length<=1) return toast('Cannot demote the only admin!','err');
    S.users=S.users.map(u=>u.id===id?{...u,role:'user'}:u);
    saveData();toast('Admin demoted to User','info');render();
  }));
  document.querySelectorAll('[data-deactivate]').forEach(el=>el.addEventListener('click',()=>{
    const id=parseInt(el.dataset.deactivate);
    const u=byId(S.users,id);
    showConfirm(`Deactivate <b>${u?.name}</b>?`, 'They will not be able to log in until reactivated.', 'Deactivate', 'info', ()=>{
      S.users=S.users.map(u=>u.id===id?{...u,active:false}:u);
      saveData();toast('User deactivated','info');render();
    });
  }));
  document.querySelectorAll('[data-activate]').forEach(el=>el.addEventListener('click',()=>{
    const id=parseInt(el.dataset.activate);
    S.users=S.users.map(u=>u.id===id?{...u,active:true}:u);
    saveData();toast('User activated!','ok');render();
  }));
  document.querySelectorAll('[data-delete-user]').forEach(el=>el.addEventListener('click',()=>{
    const id=parseInt(el.dataset.deleteUser);
    const u=byId(S.users,id);
    if(u?.role==='admin'&&S.users.filter(x=>x.role==='admin').length<=1) return toast('Cannot delete the only admin! Promote another admin first.','err');
    showConfirm(`Delete <b>${u?.name}</b>?`, 'This will permanently remove their account and all assigned tasks. This cannot be undone.', 'Delete Permanently', 'danger', ()=>{
      S.users=S.users.filter(x=>x.id!==id);
      S.tasks=S.tasks.filter(t=>t.to!==id&&t.by!==id);
      saveData();
      toast(`"${u?.name}" has been deleted`,'info');render();
    });
  }));

  // Notifications
  document.querySelectorAll('[data-mark-read]').forEach(el=>el.addEventListener('click',()=>{
    S.notifs=S.notifs.map(n=>n.id==el.dataset.markRead?{...n,read:true}:n);saveData();render();
  }));
  document.querySelectorAll('[data-del-notif]').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();S.notifs=S.notifs.filter(n=>n.id!=el.dataset.delNotif);saveData();render();
  }));

  // Filter + Search
  document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>setState({filter:el.dataset.filter})));
  const srch=document.getElementById('srch');
  if(srch) srch.addEventListener('input',e=>{S.search=e.target.value;render();});
  const usrSrch=document.getElementById('user-srch');
  if(usrSrch) usrSrch.addEventListener('input',e=>{S.userSearch=e.target.value;render();});

  // SMTP presets
  document.querySelectorAll('[data-preset]').forEach(el=>el.addEventListener('click',()=>{
    const [h,p]=el.dataset.preset.split('|');
    S.smtp={...S.smtp,host:h,port:p};render();
  }));

  // Overlay close
  const ov=document.getElementById('ov');
  if(ov) ov.addEventListener('click',e=>{if(e.target===ov)setState({modal:null});});

  // Mobile sidebar
  const sidebar=document.getElementById('sidebar');
  if(sidebar&&window.innerWidth<=700){
    document.addEventListener('click',e=>{
      if(S.sideOpen&&!sidebar.contains(e.target)&&!e.target.closest('#menu-btn'))
        setState({sideOpen:false});
    },{once:true});
  }
}

function doExport(){
  const d={exportedAt:now(),platform:'TrainIQ v2.0',tasks:S.tasks,users:S.users.map(({pw,...u})=>u),summary:{total:S.tasks.length,completed:S.tasks.filter(t=>t.status==='completed').length,users:S.users.length}};
  const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='trainiq-report.json';a.click();
  toast('Report exported!','ok');
}

// ═══════════════════════════════════
//  CUSTOM CONFIRM DIALOG (no browser confirm)
// ═══════════════════════════════════
function showConfirm(title, message, confirmLabel, type, onConfirm){
  // Remove any existing confirm dialogs
  document.getElementById('confirm-overlay')?.remove();

  const colors={danger:'var(--err)',info:'var(--bl)',ok:'var(--ok)'};
  const bgColors={danger:'rgba(239,68,68,.15)',info:'rgba(59,130,246,.15)',ok:'rgba(16,185,129,.15)'};
  const borderColors={danger:'rgba(239,68,68,.35)',info:'rgba(59,130,246,.35)',ok:'rgba(16,185,129,.35)'};
  const c=colors[type]||colors.danger;
  const bg=bgColors[type]||bgColors.danger;
  const bc=borderColors[type]||borderColors.danger;

  const el=document.createElement('div');
  el.id='confirm-overlay';
  el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px';
  el.innerHTML=`
    <div style="background:#1c2333;border:1px solid #2d3748;border-radius:12px;padding:28px;width:100%;max-width:400px;animation:fadeIn .15s ease">
      <div style="width:48px;height:48px;border-radius:12px;background:${bg};border:1px solid ${bc};display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:22px">
        ${type==='danger'?'⚠️':type==='info'?'ℹ️':'✓'}
      </div>
      <div style="font-size:16px;font-weight:700;color:#f1f5f9;margin-bottom:8px">${title}</div>
      <div style="font-size:13px;color:#94a3b8;line-height:1.6;margin-bottom:24px">${message}</div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button id="conf-cancel" style="padding:8px 18px;border-radius:8px;border:1px solid #2d3748;background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;font-family:inherit">Cancel</button>
        <button id="conf-ok" style="padding:8px 18px;border-radius:8px;border:none;background:${c};color:${type==='info'?'#fff':'#fff'};font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">${confirmLabel}</button>
      </div>
    </div>`;

  document.body.appendChild(el);

  document.getElementById('conf-cancel').onclick=()=>el.remove();
  document.getElementById('conf-ok').onclick=()=>{el.remove();onConfirm();};
  el.addEventListener('click',e=>{if(e.target===el)el.remove();});
}

function sendEmail(toEmail,toName,subject,message,taskTitle){
  // Log the email
  var fromUser=S.user||{name:'System',email:'system@trainiq.com'};
  S.emailLog.unshift({
    id:Date.now(),
    from:{name:fromUser.name,email:fromUser.email},
    to:{name:toName,email:toEmail},
    subject:subject,
    task:taskTitle,
    time:now(),
    status:'sent'
  });
  saveData();
  // Opens Gmail compose directly
  var gmailUrl = 'https://mail.google.com/mail/?view=cm'
    + '&to=' + encodeURIComponent(toEmail)
    + '&su=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(message.replace(/\\n/g,'\n'));
  var opened=window.open(gmailUrl, '_blank');
  if(!opened){
    window.location.href='mailto:'+toEmail+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(message.replace(/\\n/g,'\n'));
  }
  toast('📧 Email opened for ' + toEmail, 'ok');
}

function sendTaskCompletionEmail(taskTitle,assigneeUser,adminUser){
  if(!assigneeUser?.email)return;
  sendEmail(assigneeUser.email,assigneeUser.name,'TrainIQ — Task Completed: '+taskTitle,
    'Congratulations '+assigneeUser.name+'!\n\nYou completed: "'+taskTitle+'".\nGreat work! Your admin has been notified.\n\n— TrainIQ Platform',taskTitle);
  if(adminUser?.email)
    sendEmail(adminUser.email,adminUser.name,'TrainIQ — '+assigneeUser.name+' completed a task',
      'Task Alert:\n\n'+assigneeUser.name+' ('+assigneeUser.email+') completed:\n"'+taskTitle+'"\nTime: '+new Date().toLocaleString()+'\n\n— TrainIQ Platform',taskTitle);
}

function sendTaskAssignedEmail(taskTitle,assigneeUser,dueDate,notes){
  if(!assigneeUser?.email)return;
  sendEmail(assigneeUser.email,assigneeUser.name,'TrainIQ — New Task: '+taskTitle,
    'Hello '+assigneeUser.name+',\n\nNew task assigned: "'+taskTitle+'"'+(dueDate?'\nDue Date: '+dueDate:'')+(notes?'\nNotes: '+notes:'')+'\n\nLogin to TrainIQ to start.\n\n— TrainIQ Platform',taskTitle);
}
